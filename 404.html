<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<script>
  const path = window.location.pathname;

  const redirects = {
    '/ko':  'https://clegames.com',
    '/ko/': 'https://clegames.com',
    '/en':  'https://clegames.com',
    '/en/': 'https://clegames.com',    
  };

  const target = redirects[path];
  if (target) {
    window.location.replace(target);
  } else {
    window.location.replace('https://clegames.com');
  }
</script>
</head>
<body></body>
</html>
